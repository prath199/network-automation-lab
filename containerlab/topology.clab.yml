name: network-automation
topology:
  nodes:
    spine1: {kind: arista_ceos, image: 'ceos:4.34.9.2M'}
    spine2: {kind: arista_ceos, image: 'ceos:4.34.9.2M'}
    leaf1: {kind: arista_ceos, image: 'ceos:4.34.9.2M'}
    leaf2: {kind: arista_ceos, image: 'ceos:4.34.9.2M'}
    host1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.100.11/24 dev eth1
        - ip link set eth1 up
    host2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.100.12/24 dev eth1
        - ip link set eth1 up
  links:
    - endpoints: ['spine1:eth1', 'leaf1:eth1']
    - endpoints: ['spine2:eth1', 'leaf1:eth2']
    - endpoints: ['spine1:eth2', 'leaf2:eth1']
    - endpoints: ['spine2:eth2', 'leaf2:eth2']
    - endpoints: ['leaf1:eth3', 'host1:eth1']
    - endpoints: ['leaf2:eth3', 'host2:eth1']
