name: Offline Network Automation Checks
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r automation/requirements.txt
      - run: python -m pytest -q automation/tests
      - run: python -m compileall -q automation/python

