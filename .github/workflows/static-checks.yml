name: Static checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest PyYAML
      - run: pytest -q tests
      - run: python -c "import yaml; yaml.safe_load(open('containerlab/topology.clab.yml'))"
