! Lab-only reference for spine1
hostname spine1
service routing protocols model multi-agent
ip routing
interface Ethernet1
   no switchport
   ip address 10.0.0.0/31
interface Ethernet2
   no switchport
   ip address 10.0.0.4/31
interface Loopback0
   ip address 10.255.0.1/32
router bgp 65000
   router-id 10.255.0.1
   neighbor UNDERLAY peer group
   neighbor 10.0.0.1 peer group UNDERLAY
   neighbor 10.0.0.1 remote-as 65101
   neighbor 10.0.0.5 peer group UNDERLAY
   neighbor 10.0.0.5 remote-as 65102
   network 10.255.0.1/32
   neighbor EVPN peer group
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN update-source Loopback0
   neighbor EVPN send-community extended
   neighbor 10.255.0.11 peer group EVPN
   neighbor 10.255.0.11 remote-as 65101
   neighbor 10.255.0.12 peer group EVPN
   neighbor 10.255.0.12 remote-as 65102
   address-family evpn
      neighbor EVPN activate
