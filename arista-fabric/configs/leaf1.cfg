! Lab-only reference for leaf1
hostname leaf1
service routing protocols model multi-agent
ip routing
vlan 100
   name APP
interface Ethernet1
   no switchport
   ip address 10.0.0.1/31
interface Ethernet2
   no switchport
   ip address 10.0.0.3/31
interface Ethernet3
   switchport access vlan 100
interface Loopback0
   ip address 10.255.0.11/32
interface Loopback1
   ip address 10.255.1.11/32
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan vlan 100 vni 10100
router bgp 65101
   router-id 10.255.0.11
   neighbor UNDERLAY peer group
   neighbor 10.0.0.0 peer group UNDERLAY
   neighbor 10.0.0.0 remote-as 65000
   neighbor 10.0.0.2 peer group UNDERLAY
   neighbor 10.0.0.2 remote-as 65000
   network 10.255.0.11/32
   network 10.255.1.11/32
   neighbor EVPN peer group
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN update-source Loopback0
   neighbor EVPN send-community extended
   neighbor 10.255.0.1 peer group EVPN
   neighbor 10.255.0.1 remote-as 65000
   neighbor 10.255.0.2 peer group EVPN
   neighbor 10.255.0.2 remote-as 65000
   vlan 100
      rd 10.255.0.11:100
      route-target both 100:100
      redistribute learned
   address-family evpn
      neighbor EVPN activate
