! Lab-only reference for spine2
hostname spine2
service routing protocols model multi-agent
ip routing
interface Ethernet1
   no switchport
   ip address 10.0.0.2/31
interface Ethernet2
   no switchport
   ip address 10.0.0.6/31
interface Loopback0
   ip address 10.255.0.2/32
router bgp 65000
   router-id 10.255.0.2
   neighbor UNDERLAY peer group
   neighbor 10.0.0.3 peer group UNDERLAY
   neighbor 10.0.0.3 remote-as 65101
   neighbor 10.0.0.7 peer group UNDERLAY
   neighbor 10.0.0.7 remote-as 65102
   network 10.255.0.2/32
   neighbor EVPN peer group
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN update-source Loopback0
   neighbor EVPN send-community extended
   neighbor 10.255.0.11 peer group EVPN
   neighbor 10.255.0.11 remote-as 65101
   neighbor 10.255.0.12 peer group EVPN
   neighbor 10.255.0.12 remote-as 65102
   address-family evpn
      neighbor EVPN activate
