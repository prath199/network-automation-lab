all:
  children:
    arista_mlag:
      children:
        cer_access:
          hosts:
            MGT-01: {ansible_host: 192.0.2.11}
            MGT-02: {ansible_host: 192.0.2.12}
        it2_access:
          hosts:
            MGT-03: {ansible_host: 192.0.2.13}
            MGT-04: {ansible_host: 192.0.2.14}
        core_gateways:
          hosts:
            MGT-05: {ansible_host: 192.0.2.15}
            MGT-06: {ansible_host: 192.0.2.16}
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: arista.eos.eos
        ansible_user: "{{ lookup('env','EOS_USERNAME') }}"
        ansible_password: "{{ lookup('env','EOS_PASSWORD') }}"
